<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botanika AI Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a2a1d">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0a2a1d;--bg2:#04140d;--card:rgba(20,70,48,.45);--line:rgba(120,220,160,.25);--tx:#eafff1;--mut:#9fcdb2;--ac1:#b5f0c8;--ac2:#5fa77c;--ink:#06210f}
[data-theme=light]{--bg1:#e9f8ee;--bg2:#cfeedb;--card:rgba(255,255,255,.65);--line:rgba(30,110,60,.25);--tx:#0b2a17;--mut:#3d6b50;--ac1:#7fd4a0;--ac2:#3f9a65;--ink:#05200f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--tx);background:radial-gradient(1200px 600px at 80% -10%,var(--bg1),var(--bg2))fixed}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px max(16px,calc((100% - 980px)/2));border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;font-weight:700}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac1),var(--ac2));font-size:20px}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--tx)}
input[type=text]{ime-mode:auto}.enc-input{min-width:0;flex:1}.enc-input:focus{border-color:var(--ac1);box-shadow:0 0 0 3px rgba(181,240,200,.18)}
.pill,.btn,select{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;transition:.2s}
.telegram-link{color:var(--tx);text-decoration:none;white-space:nowrap}
.pill:hover,.btn:hover{transform:translateY(-1px);border-color:var(--ac1)}
.pill.on,.btn.pri{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:var(--ink);border-color:transparent;box-shadow:0 6px 20px rgba(95,167,124,.35)}
.btn{border-radius:12px;padding:12px 22px}
.sq{width:38px;height:38px;border-radius:10px;padding:0;background:linear-gradient(135deg,var(--ac1),var(--ac2));border:0;cursor:pointer;font-size:18px}
main{max-width:980px;margin:0 auto;padding:28px 16px 60px}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
nav .pill{font-size:13px;padding:8px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;backdrop-filter:blur(10px);margin-bottom:18px}
.drop{text-align:center;padding:48px 20px}
.drop.drag{border-color:var(--ac1);box-shadow:0 0 0 3px rgba(181,240,200,.3)}
h1,h2{font-family:'Playfair Display',serif;margin:.4em 0}
h1{font-size:clamp(26px,5vw,36px)}
.mut{color:var(--mut)}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:20px}
input[type=text],textarea{width:100%;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mini{background:rgba(0,0,0,.15);border:1px solid var(--line);border-radius:16px;padding:14px}
.mini img{width:100%;height:130px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.res{display:grid;grid-template-columns:260px 1fr;gap:22px}
@media(max-width:700px){body.responsive-on .res{grid-template-columns:1fr}}
.res img{width:100%;border-radius:16px;object-fit:cover}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac1))}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.chat{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap}.msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--ac1),var(--ac2));color:var(--ink)}.msg.a{background:rgba(0,0,0,.2)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--ac1);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}@keyframes s{to{transform:rotate(360deg)}}
.err{background:rgba(255,90,90,.15);border:1px solid rgba(255,120,120,.5);border-radius:12px;padding:12px;margin-top:14px}
dialog{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:460px;width:92%}dialog::backdrop{background:rgba(0,0,0,.6)}
body.reduce-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
tag{display:inline-block;background:rgba(181,240,200,.15);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;margin:2px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}.setting:last-of-type{border-bottom:0}.setting label{font-weight:600}.setting input[type=range]{max-width:180px}.seg{display:flex;gap:6px}.seg button{width:auto!important;padding:8px 12px!important;border:1px solid var(--line)}.seg button.on{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:var(--ink)}.switch{position:relative;width:44px;height:24px}.switch input{position:absolute;inset:0;width:44px;height:24px;margin:0;opacity:0;z-index:2;cursor:pointer}.switch i{position:absolute;inset:0;border-radius:999px;background:rgba(120,120,120,.35);border:1px solid var(--line);pointer-events:none}.switch i:after{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+i{background:var(--ac2)}.switch input:checked+i:after{transform:translateX(20px)}
@media(max-width:700px){body.responsive-on header{padding:10px 12px;gap:10px}body.responsive-on header>.logo{justify-content:center}body.responsive-on header>.hr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}body.responsive-on header>.hr>*{min-width:0}body.responsive-on header select{width:100%}body.responsive-on main{padding:16px 10px 36px}body.responsive-on nav{flex-wrap:nowrap;overflow-x:auto;margin:0 -10px 16px;padding:0 10px 8px;scrollbar-width:thin}body.responsive-on nav .pill{flex:0 0 auto}body.responsive-on .card{padding:18px 14px;border-radius:16px}body.responsive-on .drop{padding:32px 12px}body.responsive-on .row>.btn{flex:1 1 100%;width:100%}body.responsive-on .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}body.responsive-on .res img{max-height:320px;object-fit:contain}body.responsive-on table{display:block;max-width:100%;overflow-x:auto}body.responsive-on td,body.responsive-on th{padding:8px}body.responsive-on .setting{align-items:flex-start;flex-wrap:wrap;gap:8px}body.responsive-on .setting>input[type=text],body.responsive-on .setting>select{width:100%;max-width:none!important}body.responsive-on dialog{max-height:90dvh;overflow:auto}}
html[dir=rtl] body.responsive-on nav{direction:rtl}
</style>
<style>
:root{--bg1:#18382a;--bg2:#08170f;--card:rgba(20,43,32,.88);--line:rgba(205,229,199,.13);--tx:#f4f3e8;--mut:#b0c1ad;--ac1:#d2ed8b;--ac2:#79b76e;--ink:#172719}

.pill.on,.btn.pri{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:var(--ink);box-shadow:0 8px 24px color-mix(in srgb,var(--ac2) 24%,transparent)}
.sq{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);font-size:17px}
main{max-width:1120px;padding:34px 22px 72px}
nav{gap:8px;align-items:center;padding:7px;margin:0 0 24px;border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--card) 72%,transparent);box-shadow:0 14px 38px rgba(0,0,0,.08)}
nav .pill{flex:0 0 auto;border-color:transparent;background:transparent;box-shadow:none;padding:10px 14px;font-size:13px}
nav .pill.on{background:linear-gradient(135deg,var(--ac1),var(--ac2));box-shadow:0 5px 16px color-mix(in srgb,var(--ac2) 20%,transparent)}
.card{border-color:var(--line);border-radius:26px;background:linear-gradient(145deg,color-mix(in srgb,var(--card) 98%,var(--ac2) 2%),var(--card));box-shadow:0 18px 48px rgba(0,0,0,.12);backdrop-filter:blur(16px);padding:clamp(20px,3vw,32px)}
#dz.drop{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,260px);align-items:center;gap:24px;min-height:310px;overflow:hidden;padding:clamp(26px,5vw,58px);text-align:left;background:radial-gradient(460px 280px at 90% 50%,color-mix(in srgb,var(--ac2) 22%,transparent),transparent 75%),linear-gradient(135deg,color-mix(in srgb,var(--card) 90%,var(--ac2) 10%),var(--card))}
.hero-copy{position:relative;z-index:1;max-width:620px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--ac1);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac1);box-shadow:0 0 0 5px color-mix(in srgb,var(--ac1) 15%,transparent)}
#dz h1{margin:18px 0 10px;font-size:clamp(34px,6vw,58px);letter-spacing:-.055em;line-height:1.04}
#dz .hero-copy>p{max-width:430px;margin:0;color:var(--mut);font-size:16px;line-height:1.65}
#dz .row{justify-content:flex-start;margin-top:26px}
#dz .btn{min-height:50px;padding:13px 20px}
.hero-art{position:relative;display:grid;place-items:center;min-height:210px}
.hero-orb{display:grid;place-items:center;width:190px;height:190px;border:1px solid color-mix(in srgb,var(--ac1) 28%,transparent);border-radius:48% 52% 62% 38%;background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--ac1) 30%,transparent),transparent 56%),linear-gradient(145deg,color-mix(in srgb,var(--ac2) 35%,transparent),color-mix(in srgb,var(--ac2) 8%,transparent));font-size:76px;transform:rotate(-8deg);box-shadow:0 0 0 18px color-mix(in srgb,var(--ac2) 6%,transparent),0 0 0 38px color-mix(in srgb,var(--ac2) 4%,transparent)}
.hero-orb span{transform:rotate(8deg);filter:drop-shadow(0 16px 16px rgba(0,0,0,.2))}
#pendingArea:empty{display:none}
.grid{gap:18px}
.mini{border-color:var(--line);border-radius:20px;background:color-mix(in srgb,var(--card) 90%,transparent);padding:16px;transition:transform .2s,border-color .2s,box-shadow .2s}
.mini:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac2) 42%,var(--line));box-shadow:0 14px 30px rgba(0,0,0,.12)}
.mini img{height:170px;border-radius:14px}
.res{grid-template-columns:minmax(220px,300px) minmax(0,1fr);align-items:start;gap:28px}
.res img{max-height:440px}
input[type=text],textarea{min-height:48px;border-color:var(--line);background:color-mix(in srgb,var(--bg2) 65%,transparent);border-radius:14px}
input[type=text]:focus,textarea:focus,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--ac1) 68%,transparent);outline-offset:3px}
table{border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:16px}
td,th{padding:12px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.spin{width:38px;height:38px;border-width:3px}
dialog{max-width:540px;border-color:var(--line);background:var(--bg2);box-shadow:0 28px 90px rgba(0,0,0,.32)}
@media(max-width:760px){
 header{padding:12px 18px}
 main{padding:24px 18px 52px}
 nav{max-width:100%;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;margin:0 -4px 20px;padding:6px;scrollbar-width:none;overscroll-behavior-x:contain}
 nav::-webkit-scrollbar{display:none}
 nav .pill{padding:10px 13px}
 #dz.drop{grid-template-columns:minmax(0,1fr) 170px;min-height:270px;padding:28px}
 .hero-orb{width:148px;height:148px;font-size:62px}
 .res{grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:20px}
}
@media(max-width:560px){
 header{align-items:center;gap:12px}
 .logo{font-size:15px}
 .logo .ic{width:38px;height:38px;border-radius:13px}
 header>.hr{display:grid;grid-template-columns:minmax(0,1fr) minmax(105px,.8fr) 42px 42px;gap:7px;width:100%}
 header>.hr>*{min-width:0}
 header>.hr select{width:100%;padding:9px 10px;font-size:13px}
 .telegram-link{padding:9px 10px;font-size:13px}
 .sq{width:42px;height:42px}
 main{padding:20px 14px 42px}
 nav{margin-right:-14px;margin-left:-14px;border-right:0;border-left:0;border-radius:0}
 #dz.drop{grid-template-columns:minmax(0,1fr);min-height:0;gap:18px;padding:26px 20px}
 #dz h1{font-size:38px}
 #dz .hero-copy>p{font-size:15px}
 #dz .row{display:grid;grid-template-columns:1fr;margin-top:20px}
 #dz .btn{width:100%}
 .hero-art{position:absolute;right:-46px;top:-40px;min-height:0;opacity:.24;pointer-events:none}

 .res img{max-height:330px;object-fit:contain}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.mini,.pill,.btn{transition:none}}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="ic">🌿</div><span>Botanika AI Pro</span><span id="profileBadge" class="mut"></span></div>
  <div class="hr">
    <button class="pill on" id="topAnalyze" onclick="go('analyze')">🔍 Анализ</button>
    <button class="pill" id="hbtn" onclick="go('history')">📋 История (0)</button>

    <select id="lang" aria-label="Interface language" onchange="setLanguage(this.value)">
      <option value="ru">Русский</option><option value="en">English</option><option value="uz">O'zbek</option>
      <option value="az">Azərbaycan</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="pt">Português</option><option value="ar">العربية</option><option value="tr">Türkçe</option><option value="uk">Українська</option><option value="kk">Қазақ тілі</option><option value="ky">Кыргызча</option><option value="tg">Тоҷикӣ</option><option value="fa">فارسی</option><option value="hi">हिन्दी</option><option value="bn">বাংলা</option><option value="zh">中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="it">Italiano</option><option value="nl">Nederlands</option><option value="pl">Polski</option><option value="cs">Čeština</option><option value="sk">Slovenčina</option><option value="sv">Svenska</option><option value="no">Norsk</option><option value="da">Dansk</option><option value="fi">Suomi</option><option value="el">Ελληνικά</option><option value="he">עברית</option><option value="id">Bahasa Indonesia</option><option value="ms">Bahasa Melayu</option><option value="th">ไทย</option><option value="vi">Tiếng Việt</option><option value="ro">Română</option>
    </select>
    <button class="sq" title="Настройки" onclick="dlg.showModal()">⚙️</button>

</header>
<main>
  <nav id="tabs"></nav>
  <div id="view"></div>
</main>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="cam" accept="image/*" capture="environment" multiple hidden>
<dialog id="dlg">
  <h2 id="settingsTitle">Настройки</h2>
  <div class="setting"><label id="themeLabel">Тема</label><div class="seg"><button id="themeDark" onclick="setTheme('dark')">Ночная</button><button id="themeLight" onclick="setTheme('light')">Светлая</button></div></div>
  <div class="setting"><label id="brightnessLabel" for="brightness">Яркость</label><input id="brightness" type="range" min="80" max="120" value="100" oninput="setBrightness(this.value)"></div>

  <div class="setting"><label id="motionLabel" for="reducedMotion">Сократить анимацию</label><label class="switch"><input id="reducedMotion" type="checkbox" onchange="setReducedMotion(this.checked)"><i></i></label></div>
  <div class="setting"><label id="responsiveLabel" for="responsiveLayout">Адаптация экрана</label><label class="switch"><input id="responsiveLayout" type="checkbox" onchange="setResponsiveLayout(this.checked)" checked><i></i></label></div>
  <div class="setting"><label id="profileLabel" for="profileName">Имя профиля</label><input id="profileName" type="text" maxlength="40" placeholder="Ваше имя" oninput="setProfileName(this.value)" style="max-width:180px"></div>

      <input id="syncCode" type="text" maxlength="12" autocomplete="one-time-code" placeholder="Код из Telegram" onkeydown="if(event.key==='Enter')connectTelegramSync()" style="max-width:180px;text-transform:uppercase">
      <button class="pill" id="syncConnect" onclick="connectTelegramSync()">Подключить</button>
      <button class="pill" id="syncDisconnect" onclick="disconnectTelegramSync()" hidden>Отключить</button>
    </div>
  </div>

  <div class="setting"><label id="diagnosticsLabel" for="recognitionDiagnostics">Диагностика распознавания</label><label class="switch"><input id="recognitionDiagnostics" type="checkbox" onchange="setDiagnostics(this.checked)"><i></i></label></div>
  <div class="row"><button class="btn" id="checkFeatures" onclick="runDiagnostics()">Проверить функции</button></div>
  <div class="row"><button class="btn pri" id="settingsDone" onclick="dlg.close()">Готово</button></div>
</dialog>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,d)=>{try{return JSON.parse(localStorage[k])??d}catch{return d}};
let S=LS('bot_s',{lang:'ru',theme:'dark',brightness:100,textSize:'normal',reducedMotion:false,profileName:'',wateringNotifications:false,compressImages:true,recognitionDiagnostics:false}), H=LS('bot_h',[]), G=LS('bot_g',[]), tab='analyze', chat=[], pending=[];
let syncMeta=LS('bot_sync_meta',{tombstones:{history:{},greenhouse:{}}});

let DB=null;
function openDB(){
  if(!('indexedDB' in window))return Promise.resolve(null);
  if(DB)return Promise.resolve(DB);
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open('botanika-ai-db',1);
    r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('history'))db.createObjectStore('history',{keyPath:'id'});if(!db.objectStoreNames.contains('greenhouse'))db.createObjectStore('greenhouse',{keyPath:'id'})};
    r.onsuccess=()=>{DB=r.result;resolve(DB)};
    r.onerror=()=>reject(r.error)
  })
}
async function syncDB(){
  try{
    const db=await openDB();if(!db)return;
    const tx=db.transaction(['history','greenhouse'],'readwrite');
    const hs=tx.objectStore('history'),gs=tx.objectStore('greenhouse');
    hs.clear();gs.clear();
    H.forEach(r=>hs.put(r));G.forEach(g=>gs.put(g));
  }catch{}
}
async function loadDB(){
  try{
    const db=await openDB();if(!db)return;
    const tx=db.transaction(['history','greenhouse'],'readonly');
    const history=await new Promise((resolve,reject)=>{const r=tx.objectStore('history').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)});
    const greenhouse=await new Promise((resolve,reject)=>{const r=tx.objectStore('greenhouse').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)});
    if(history.length)H=history.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    if(greenhouse.length)G=greenhouse;
  }catch{}
}
function makeLocalId(){
  const random=new Uint32Array(1);
  crypto.getRandomValues(random);
  let id=Math.floor(Date.now()/1000)*100000+(random[0]%100000);
  while(H.some(item=>item&&item.id===id)||G.some(item=>item&&item.id===id))id++;
  return id
}
function normalizeLocalIds(){
  const mapped=new Map(),used=new Set();
  if(!syncMeta||typeof syncMeta!=='object')syncMeta={tombstones:{history:{},greenhouse:{}}};
  if(!syncMeta.tombstones||typeof syncMeta.tombstones!=='object')syncMeta.tombstones={history:{},greenhouse:{}};
  const normalize=id=>{
    const key=String(id);
    if(mapped.has(key))return mapped.get(key);
    const numeric=Number(id);
    let value;
    if(Number.isSafeInteger(numeric)&&numeric>0)value=numeric;
    else if(Number.isFinite(numeric)&&numeric>0){
      const whole=Math.floor(numeric),fraction=Math.floor((numeric-whole)*1000);
      value=whole*1000+fraction
    }else value=makeLocalId();
    while(used.has(value))value++;
    used.add(value);mapped.set(key,value);return value
  };
  H.forEach(item=>{if(item&&item.id!==undefined)item.id=normalize(item.id)});
  G.forEach(item=>{if(item&&item.id!==undefined)item.id=normalize(item.id)});
  for(const collection of ['history','greenhouse']){
    const entries=syncMeta.tombstones[collection];
    if(!entries)continue;
    const normalized={};
    for(const [id,time] of Object.entries(entries)){
      const numeric=Number(id),key=mapped.get(String(id))|| (Number.isSafeInteger(numeric)?numeric:normalize(id));
      normalized[key]=time
    }
    syncMeta.tombstones[collection]=normalized
  }
}

function normalizeTombstones(value){
  const result={history:{},greenhouse:{}};
  if(!value||typeof value!=='object')return result;
  for(const key of ['history','greenhouse']){
    const source=value[key];
    if(!source||typeof source!=='object')continue;
    for(const [id,time] of Object.entries(source).slice(-500)){
      if(Number.isFinite(Number(id))&&Number(time)>0)result[key][id]=Number(time)
    }
  }
  return result
}
function linkLocalPlantPhotos(){
  for(const plant of G){
    if(!plant||plant.imagePath)continue;
    const history=H.find(item=>{
      if(!item)return false;
      const gardenId=Number(item.gardenId)||Number(item.id);
      return gardenId===Number(plant.id)
        ||item.telegramAnalysisId&&item.telegramAnalysisId===plant.sourceAnalysisId
    });
    if(history&&history.imagePath)plant.imagePath=history.imagePath
  }
}

  const remote=record&&typeof record==='object'?record:{};
  const remoteTombstones=normalizeTombstones(remote.tombstones);

function addG(id){const r=H.find(x=>x.id==id),gardenId=Number(r&&r.gardenId)||id;if(!r||G.find(g=>g.id==gardenId||r.telegramAnalysisId&&g.sourceAnalysisId===r.telegramAnalysisId))return;const timestamp=Date.now();G.push({id:gardenId,name:r.name,img:r.img,imagePath:r.imagePath||'',days:+r.watering_days||7,last:timestamp,updatedAt:timestamp,sourceAnalysisId:r.telegramAnalysisId||''});save();go('green')}

const R={
analyze_html:()=>`<section class="card drop" id="dz"><div class="hero-copy"><span class="eyebrow">BOTANIKA · AI PLANT CARE</span><h1>${tr('analyze')}</h1><p>${tr('pick')}</p><div class="row"><button class="btn pri" onclick="cam.click()">📷 ${tr('takePhoto')}</button><button class="btn" onclick="file.click()">🖼 ${tr('choosePhoto')}</button></div></div><div class="hero-art" aria-hidden="true"><div class="hero-orb"><span>🌱</span></div></div></section><div id="pendingArea" class="pending-area"></div>`,
analyze(){ $('#view').innerHTML=R.analyze_html();const dz=$('#dz');dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag')};dz.ondragleave=()=>dz.classList.remove('drag');dz.ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};renderPending()},
history(){$('#view').innerHTML=H.length?`<div class="grid">${H.map(r=>{const img=imageSource(r);return`<div class="mini">${img?`<img src="${esc(img)}">`:''}<b>${esc(r.name)}</b><div class="mut" style="font-size:12px">${esc(r.date)}</div><div class="row" style="margin-top:8px;justify-content:flex-start"><button class="pill" onclick="show(H.find(x=>x.id==${r.id}))">${tr('open')}</button><button class="pill" title="${tr('remove')}" aria-label="${tr('remove')}" onclick="deleteHistory(${r.id})">🗑</button></div></div>`}).join('')}</div>`:`<div class="card mut" style="text-align:center">${tr('emptyHistory')}</div>`},
green(){$('#view').innerHTML=G.length?`<div class="grid">${G.map(g=>{const img=imageSource(g);return`<div class="mini">${img?`<img src="${esc(img)}">`:''}<b>${esc(g.name)}</b><div class="mut">${tr('wateringEvery').replace('{n}',g.days)}</div><div class="row" style="margin-top:8px;justify-content:flex-start"><button class="pill" onclick="water(${g.id})">💧 ${tr('watered')}</button><button class="pill" title="${tr('remove')}" aria-label="${tr('remove')}" onclick="deletePlant(${g.id})">🗑</button></div></div>`}).join('')}</div>`:`<div class="card mut" style="text-align:center">${tr('emptyGreenhouse')}</div>`},
cal(){const L=G.map(g=>({...g,next:g.last+g.days*864e5})).sort((a,b)=>a.next-b.next);$('#view').innerHTML=`<div class="card"><h2>${tr('calendarTitle')}</h2>${L.length?`<table>${L.map(g=>{const d=Math.ceil((g.next-Date.now())/864e5);return`<tr><td><b>${esc(g.name)}</b></td><td>${new Date(g.next).toLocaleDateString(S.lang)}</td><td>${d<=0?`<span class="tag">💧 ${tr('watering')}!</span>`:`${d} d.`}</td><td><button class="pill" onclick="water(${g.id},1)">${tr('watered')}</button></td></tr>`}).join('')}</table>`:`<p class="mut">${tr('noGreenhousePlants')}</p>`}</div>`},
disease(){$('#view').innerHTML=`<div class="card"><h2>Справочник болезней растений</h2><div class="grid"><div class="mini"><b>Мучнистая роса</b><p class="mut">Белый мучнистый налёт на листьях.</p><p>Отделите поражённые листья, улучшите вентиляцию и проверьте режим полива.</p></div><div class="mini"><b>Пятнистость</b><p class="mut">Коричневые или чёрные пятна.</p><p>Удалите поражённые части и не допускайте попадания воды на листву.</p></div><div class="mini"><b>Корневая гниль</b><p class="mut">Корни темнеют и становятся мягкими.</p><p>Уменьшите полив, замените грунт и пересадите растение в дренированный горшок.</p></div><div class="mini"><b>Паутинный клещ</b><p class="mut">Тонкая паутинка и точки на листьях.</p><p>Изолируйте растение и обработайте разрешённым для комнатных растений препаратом.</p></div></div><p class="mut">Справочник — предварительная помощь. При сомнениях обратитесь к специалисту.</p></div>`},
enc(){const [title,placeholder,search]=ENC_TEXT[S.lang]||ENC_TEXT.ru;const rtl=['ar','fa','he'].includes(S.lang);$('#view').innerHTML=`<div class="card"><h2>${esc(title)}</h2><form id="encForm" style="display:flex;gap:10px"><input class="enc-input" type="text" id="q" name="q" lang="${S.lang}" dir="${rtl?'rtl':'auto'}" placeholder="${esc(placeholder)}" autocomplete="on" autocapitalize="sentences" spellcheck="true"><button class="btn pri" type="submit">${esc(search)}</button></form><div id="out"></div></div>`;$('#encForm').onsubmit=e=>{e.preventDefault();ask()};$('#q').focus()},
cmp(){$('#view').innerHTML=`<div class="card"><h2>${tr('compareTitle')}</h2><div style="display:flex;gap:10px;flex-wrap:wrap"><input type="text" id="a" placeholder="${tr('plantOne')}" style="flex:1"><input type="text" id="b" placeholder="${tr('plantTwo')}" style="flex:1"><button class="btn pri" onclick="compare()">${tr('compareNow')}</button></div><div id="out"></div></div>`},
exp(){$('#view').innerHTML=`<div class="card"><h2>${tr('expertTitle')}</h2><div class="chat" id="chat">${chat.map(m=>`<div class="msg ${m.role=='user'?'u':'a'}">${esc(m.content)}</div>`).join('')||`<div class="mut">${tr('questionPrompt')}</div>`}</div><div style="display:flex;gap:10px"><input type="text" id="q" placeholder="${tr('questionPrompt')}"><button class="btn pri" onclick="send()">${tr('send')}</button></div></div>`;$('#q').onkeydown=e=>e.key=='Enter'&&send()}};
function water(id,c){const g=G.find(x=>x.id==id);if(!g)return;g.last=Date.now();g.updatedAt=Date.now();save();c?R.cal():R.green()}
function safeHttpsUrl(value){try{const u=new URL(value);return u.protocol==='https:'?u.href:''}catch{return''}}
async function configureTelegramBotLink(){
  const link=$('#telegramBotLink');
  if(!link)return;
  try{
    const response=await fetch('/api/config',{cache:'no-store'});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);
    const url=safeHttpsUrl(data.telegramBotUrl);
    if(!url)throw new Error('Telegram bot URL is invalid');
    link.href=url;
    link.hidden=false
  }catch(error){
    link.hidden=true;
    console.warn('Botanika Telegram link is unavailable:',error.message)
  }
}
function showEncyclopedia(data,query){
  const images=(data.images||[]).filter(image=>safeHttpsUrl(image.url));
  const sources=(data.sources||[]).filter(source=>safeHttpsUrl(source.url));
  const care=data.care||{};
  const reference=data.reference&&data.reference.extract?`<h3>Справочная информация</h3><p>${esc(data.reference.extract)}</p>`:'';
  const facts=(data.interesting_facts||[]).map(f=>`<li>${esc(f)}</li>`).join('');
  const imageGrid=images.length?`<div class="grid">${images.map(image=>`<a class="mini" href="${esc(safeHttpsUrl(image.page_url)||image.url)}" target="_blank" rel="noopener noreferrer"><img src="${esc(image.url)}" alt="${esc(image.title||data.title||query)}" loading="lazy"><span>${esc(image.title||'Изображение · Wikimedia Commons')}</span></a>`).join('')}</div>`:`<p class="mut">Изображения для этого запроса не найдены.</p>`;
  const sourceLinks=sources.map(source=>`<a href="${esc(safeHttpsUrl(source.url))}" target="_blank" rel="noopener noreferrer">${esc(source.title)}</a>`).join(' · ');
  $('#out').innerHTML=`<article class="card"><h2>${esc(data.title||query)}</h2>${data.scientific_name?`<p class="mut"><i>${esc(data.scientific_name)}</i></p>`:''}<p>${esc(data.summary||'Описание не найдено.')}</p>${reference}<h3>Изображения</h3>${imageGrid}<h3>Уход</h3><table><tr><td>💧 Полив</td><td>${esc(care.watering)}</td></tr><tr><td>☀️ Освещение</td><td>${esc(care.light)}</td></tr><tr><td>🪴 Почва</td><td>${esc(care.soil)}</td></tr><tr><td>🌡 Температура</td><td>${esc(care.temperature)}</td></tr></table><h3>Чем полезно</h3><p>${esc(data.uses||'Информация не найдена.')}</p><h3>Безопасность</h3><p>${esc(data.toxicity||'Данные о безопасности не указаны; проверьте надёжные источники.')}</p>${facts?`<h3>Интересные факты</h3><ul>${facts}</ul>`:''}<p class="mut">${esc(data.disclaimer||'Сведения сгенерированы ИИ и требуют проверки; не используйте их как медицинскую рекомендацию.')}</p><p>${sourceLinks}</p><p><a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" rel="noopener noreferrer">Искать информацию в Google</a> · <a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(query)}" target="_blank" rel="noopener noreferrer">Искать изображения в Google</a></p></article>`;
}
async function ask(){
  const q=$('#q').value.trim();if(!q)return;
  $('#out').innerHTML=spin();
  try{const data=await api('/api/encyclopedia',{query:q});showEncyclopedia(data,q)}
  catch(e){const direct=`https://www.google.com/search?q=${encodeURIComponent(q)}`;$('#out').innerHTML=err(e.message)+`<p><a href="${esc(direct)}" target="_blank" rel="noopener noreferrer">Открыть поиск Google</a></p>`}
}
async function compare(){const a=$('#a').value.trim(),b=$('#b').value.trim();if(!a||!b)return;$('#out').innerHTML=spin();try{const d=await api('/api/compare',{a,b});$('#out').innerHTML=`<table><tr><th></th><th>${esc(a)}</th><th>${esc(b)}</th></tr>${d.rows.map(r=>`<tr><td class="mut">${esc(r.param)}</td><td>${esc(r.a)}</td><td>${esc(r.b)}</td></tr>`).join('')}</table><p>🏆 ${esc(d.verdict)}</p>`}catch(e){$('#out').innerHTML=err(e.message)}}
async function send(){const q=$('#q').value.trim();if(!q)return;chat.push({role:'user',content:q});R.exp();$('#chat').insertAdjacentHTML('beforeend',spin());try{const d=await api('/api/expert',{messages:chat});chat.push({role:'assistant',content:d.text});R.exp()}catch(e){chat.pop();R.exp();$('#chat').insertAdjacentHTML('beforeend',err(e.message))}$('#chat').scrollTop=1e9}

async function runDiagnostics(){
  const pwaReady=(location.protocol==='http:'||location.protocol==='https:')&&'serviceWorker' in navigator&&!!document.querySelector('link[rel="manifest"]');
  const checks={
    'IndexedDB':!!await openDB().catch(()=>null),
    'Сжатие изображений':!!(window.createImageBitmap&&document.createElement('canvas').getContext),
    'Уведомления':('Notification' in window),
    'PWA':pwaReady,
    'Локальный профиль':typeof localStorage!=='undefined'
  };
  const output=Object.entries(checks).map(([name,ok])=>`<p>${ok?'✅':'❌'} ${esc(name)}</p>`).join('');
  const old=$('#diagnosticOutput');if(old)old.remove();
  dlg.insertAdjacentHTML('beforeend',`<div id="diagnosticOutput" class="mut" style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px">${output}</div>`);
}
function checkWateringNotifications(){
  if(!S.wateringNotifications||!('Notification' in window)||Notification.permission!=='granted')return;
  const today=new Date().toISOString().slice(0,10);
  G.forEach(g=>{const due=g.last+g.days*864e5,key='bot_water_notice_'+g.id;if(due<=Date.now()&&localStorage.getItem(key)!==today){new Notification('Пора полить растение',{body:g.name||'Проверьте оранжерею',tag:'watering-'+g.id});localStorage.setItem(key,today)}});
}

function applyPendingUpdate(){
  if(!waitingForUpdate||pending.length||reloadingForUpdate)return;
  reloadingForUpdate=true;
  location.reload()
}
file.onchange=cam.onchange=e=>{addFiles(e.target.files);e.target.value=''};
document.addEventListener('paste',e=>{const files=[...e.clipboardData.files].filter(f=>f.type.startsWith('image/'));if(files.length)addFiles(files)});
window.addEventListener('offline',()=>{if(cloudLinked)setCloudSyncStatus('offline')});
window.addEventListener('online',()=>{if(cloudLinked)syncWithCloud()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudLinked)syncWithCloud()});
setInterval(checkWateringNotifications,30*60*1000);
setInterval(()=>{if(cloudLinked&&!document.hidden)syncWithCloud()},120000);
if('serviceWorker' in navigator){
  const hadController=!!navigator.serviceWorker.controller;
  let firstController=true;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(firstController&&!hadController){firstController=false;return}
    firstController=false;
    waitingForUpdate=true;
    applyPendingUpdate()
  });
  navigator.serviceWorker.register('./sw.js').then(registration=>{
    const checkForUpdate=()=>registration.update().catch(error=>console.warn('Botanika update check failed:',error.message));
    window.addEventListener('online',checkForUpdate);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForUpdate()});
    checkForUpdate()
  }).catch(error=>console.warn('Botanika offline support could not start:',error.message))
}
loadDB().then(()=>{normalizeLocalIds();save();go('analyze');checkWateringNotifications();syncWithCloud()});
configureTelegramBotLink()
</script>
